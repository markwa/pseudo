<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCR Pseudocode Teaching Tool</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
  <div id="app" class="app-shell" v-cloak>
    <header class="topbar">
      <div>
        <div class="eyebrow">OCR pseudocode teaching tool</div>
      </div>
      <div class="toolbar">
        <label class="select-wrap">
          <span>Example</span>
          <select v-model.number="selectedExample">
            <option v-for="(example, idx) in examples" :key="example.name" :value="idx">{{ example.name }}</option>
          </select>
        </label>
        <button class="btn secondary" @click="loadExample">Load Example</button>
        <button class="btn primary" @click="runProgram" :disabled="running">Run</button>
        <button class="btn" @click="stopProgram">Stop / Reset</button>
        <button class="btn" @click="clearOutput">Clear Output</button>
        <button class="btn" @click="showJs = !showJs">{{ showJs ? 'Hide JS' : 'Show JS' }}</button>
      </div>
    </header>

    <main class="workspace">
      <section class="panel editor-panel">
        <div class="panel-head">
          <h2>Pseudocode editor</h2>
          <span class="status" :class="{ running }">{{ running ? 'Running' : 'Idle' }}</span>
        </div>
        <div class="editor-shell">
          <div class="line-gutter" ref="gutterScroll" aria-hidden="true">
            <div v-for="n in editorLineCount" :key="n">{{ n }}</div>
          </div>
          <textarea
            v-model="editorText"
            @scroll="syncEditorScroll"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            autocorrect="off"
            class="editor"
            placeholder="Type OCR pseudocode here..."
          ></textarea>
        </div>
      </section>

      <section class="panel terminal-panel">
        <div class="panel-head">
          <h2>Terminal</h2>
          <span class="status muted">{{ terminalStatus }}</span>
        </div>
        <div class="terminal" ref="terminalScroll">
          <div v-for="(line, idx) in outputLines" :key="idx" class="terminal-line" :class="line.kind">
            <span v-text="line.text"></span>
          </div>
          <div v-if="promptActive" class="terminal-line prompt">
            <span v-text="promptText"></span>
          </div>
        </div>
        <form class="input-bar" @submit.prevent="submitInput">
          <input
            ref="inputField"
            v-model="inputValue"
            type="text"
            :disabled="!promptActive"
            :placeholder="promptActive ? 'Enter input and press Return' : 'Run a program to enable input'"
          >
          <button class="btn primary" type="submit" :disabled="!promptActive">Send</button>
        </form>
      </section>
    </main>

    <section v-if="showJs" class="panel js-panel">
      <div class="panel-head">
        <h2>Generated JavaScript</h2>
        <span class="status muted">Teaching view</span>
      </div>
      <pre class="js-view">{{ generatedJs || '// Run the program to see generated JavaScript.' }}</pre>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
