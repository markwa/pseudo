<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCR Pseudocode Teaching Tool</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
  <div id="app" class="app-shell" v-cloak>
    <header class="topbar">
      <div>
        <div class="eyebrow">OCR pseudocode teaching tool</div>
      </div>
      <div class="toolbar">
        <label class="select-wrap">
          <span>Example</span>
          <select v-model.number="selectedExample">
            <option v-for="(example, idx) in examples" :key="example.name" :value="idx">{{ example.name }}</option>
          </select>
        </label>
        <button class="btn secondary" @click="loadExample">Load Example</button>
        <button class="btn primary" @click="runProgram" :disabled="running">Run</button>
        <button class="btn" @click="stopProgram">Stop / Reset</button>
        <button class="btn" @click="showJs = !showJs">{{ showJs ? 'Hide JS' : 'Show JS' }}</button>
      </div>
    </header>

    <main class="workspace">
      <section class="panel editor-panel">
        <div class="panel-head">
          <h2>{{ showJs ? 'Generated JavaScript' : 'Pseudocode editor' }}</h2>
          <span class="status" :class="{ running }">{{ running ? 'Running' : 'Idle' }}</span>
        </div>
        <template v-if="!showJs">
          <div class="editor-shell">
            <div class="line-gutter" ref="gutterScroll" aria-hidden="true">
              <div v-for="n in editorLineCount" :key="n">{{ n }}</div>
            </div>
            <textarea
              v-model="editorText"
              @scroll="syncEditorScroll"
              spellcheck="false"
              autocapitalize="off"
              autocomplete="off"
              autocorrect="off"
              class="editor"
              placeholder="Type OCR pseudocode here..."
            ></textarea>
          </div>
        </template>
        <template v-else>
          <pre class="js-view">{{ generatedJs || '// Run the program to see generated JavaScript.' }}</pre>
        </template>
      </section>

      <section class="panel terminal-panel">
        <div class="panel-head">
          <h2>Terminal</h2>
          <span class="status muted">{{ terminalStatus }}</span>
        </div>
        <div class="terminal" ref="terminalScroll">
          <div v-for="(line, idx) in outputLines" :key="idx" class="terminal-line" :class="line.kind">
            <span v-text="line.text"></span>
          </div>
          <form v-if="promptActive" class="terminal-line prompt terminal-input-line" @submit.prevent="submitInput">
            <span class="terminal-prompt" v-text="promptText"></span>
            <input
              ref="inputField"
              v-model="inputValue"
              class="terminal-input"
              type="text"
              spellcheck="false"
              autocapitalize="off"
              autocomplete="off"
              autocorrect="off"
              placeholder=""
            >
          </form>
        </div>
      </section>
    </main>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
